# nav2_robot3.yaml — Nav2 params for robot_3, adapted from
#   /opt/ros/jazzy/share/nav2_bringup/params/nav2_multirobot_params_1.yaml
# (DWB controller, smaller footprint) plus the smoother_server / route_server /
# velocity_smoother sections from nav2_params.yaml, so EVERY lifecycle node that
# navigation_launch.py starts (controller, smoother, planner, route, behavior,
# velocity_smoother, collision_monitor, bt_navigator, waypoint_follower,
# docking_server) can configure+activate under autostart.
#
# navigation_launch.py wraps this whole file under the robot_3 namespace via
# RewrittenYaml(root_key=namespace), so keys stay flat (controller_server:, ...).
#
# Rebindings vs the stock template:
#   - all frames -> robot_3/{map,odom,base_footprint}
#   - scan sources -> ABSOLUTE /robot_3/scan  (relative 'scan' would resolve under
#     the costmap sub-namespace /robot_3/global_costmap/... — wrong topic)
#   - static_layer map_topic -> ABSOLUTE /robot_3/map  (SLAM's OccupancyGrid)
#   - enable_stamped_cmd_vel: false on every cmd_vel producer — the bridged
#     /robot_3/cmd_vel is geometry_msgs/Twist, NOT TwistStamped
#   - robot_radius 0.11 (burger ~0.105 m) and inflation_radius 0.25
#
# GENERATED from nav2_robot0.yaml by s/robot_0/robot_3/g. Do NOT hand-edit:
# edit nav2_robot0.yaml and regenerate all four. explore.launch.py picks the file by robot_id.

bt_navigator:
  ros__parameters:
    global_frame: robot_3/map
    robot_base_frame: robot_3/base_footprint
    odom_topic: /robot_3/odom
    bt_loop_duration: 10
    # default_server_timeout is the BtActionNode ACK window (ms): after
    # async_send_goal the BT action client waits this long for the server to
    # acknowledge, and on expiry emits "Timed out while waiting for action
    # server to acknowledge goal request for <action>". Nav2's stock 20 ms is
    # too tight at RTF ~0.77 with 5 robots contending — it cost 4 of 7 goals in
    # explore_gate1.log. Raised 20 -> 500 ms. Distinct from
    # wait_for_service_timeout below, which governs how long the client waits
    # for the server to EXIST ("not available after waiting") and cannot
    # produce the acknowledge-timeout message.
    default_server_timeout: 500
    # Raised 1000 -> 5000 ms. NOTE: originally justified by the acknowledge-
    # timeout message above — that attribution was wrong. Retained as
    # reasonable slack for lifecycle bring-up, not as a fix for that failure.
    wait_for_service_timeout: 5000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    controller_frequency: 20.0
    # CRITICAL: /robot_3/cmd_vel is geometry_msgs/Twist (unstamped) — the gz bridge
    # is Twist<->gz.msgs.Twist. Nav2 Jazzy can emit TwistStamped; force plain Twist.
    enable_stamped_cmd_vel: false
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: True
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.22          # burger max linear
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.22
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      # Raised 0.2 -> 0.5. NOTE: the mechanism given in ea59e20 -- that 0.2 s
      # sat inside a load-driven TF excursion tail -- is wrong. The rung2e pilot
      # (172 goals, ~70 min) disproved it: 19 goals still failed with
      # error_code=102, each with a matching "Transform data too old" from this
      # server's tf_help, so the fault was not eliminated. All 19 fall inside one
      # region -- x in [-2.3, -5.8], y in [6.0, 9.1] -- and zero occur anywhere
      # else in the 20x20 m world; several are exact repeats of the same
      # frontier. Load-driven jitter would scatter across the run and across the
      # map. It did not. The failures are spatially localised.
      #
      # That region is feature-poor. knowledge_world.sdf puts all four interior
      # walls in the central band (y=+3.0, y=-3.0, x=-4.0, x=+4.0), so the region
      # is north of every one of them, and the x=-10 boundary is 4.2 m away --
      # past the 3.5 m lidar ceiling. Whatever is in range there is a wall
      # running along x, and a single straight wall gives no constraint along its
      # own length: the degenerate case for laser scan matching. The pose graph
      # stalls, and map->odom goes stale in content while staying fresh in
      # timestamp.
      #
      # So 0.5 s did not fix the fault, it made it non-terminal: the run absorbed
      # all 19 and reached frontier exhaustion, where rung2b and rung2d each died
      # on the first occurrence. The underlying cause is scan-matching degeneracy
      # in featureless regions and no value of this parameter addresses it.
      #
      # The clearance bound is unchanged and still holds: 0.5 s at max_vel_x
      # 0.22 m/s is ~0.11 m of positional uncertainty, against a footprint-to-
      # inflated-envelope clearance of inflation_radius 0.25 - robot_radius
      # 0.11 = 0.14 m, leaving ~0.03 m of headroom. It scales with max_vel_x: if
      # the robot is sped up, this must come down or inflation_radius must go up.
      transform_tolerance: 0.5
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 0.0
      GoalAlign.scale: 0.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: robot_3/odom
      robot_base_frame: robot_3/base_footprint
      # Was unset, i.e. the Nav2 default of 0.3. Set to 0.5 to match
      # controller_server; see the full rationale on FollowPath's
      # transform_tolerance above. In short: the load-driven excursion-tail story
      # in ea59e20 is wrong. rung2e showed the error_code=102 failures are
      # spatially localised to one feature-poor region (x in [-2.3, -5.8], y in
      # [6.0, 9.1]) where scan matching against a single straight wall is
      # degenerate; 0.5 s did not eliminate them, it made them non-terminal.
      # The clearance bound is unchanged: 0.5 s at 0.22 m/s is ~0.11 m of
      # positional uncertainty against inflation_radius 0.25 - robot_radius
      # 0.11 = 0.14 m of clearance, ~0.03 m of headroom, scaling with max_vel_x.
      transform_tolerance: 0.5
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.11
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.25
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /robot_3/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: robot_3/map
      robot_base_frame: robot_3/base_footprint
      # Was unset, i.e. the Nav2 default of 0.3. Set to 0.5 to match
      # controller_server; see the full rationale on FollowPath's
      # transform_tolerance above. In short: the load-driven excursion-tail story
      # in ea59e20 is wrong. rung2e showed the error_code=102 failures are
      # spatially localised to one feature-poor region (x in [-2.3, -5.8], y in
      # [6.0, 9.1]) where scan matching against a single straight wall is
      # degenerate; 0.5 s did not eliminate them, it made them non-terminal.
      # This costmap is the one keyed on robot_3/map, so it is the direct
      # consumer of the map->odom that goes stale when the pose graph stalls.
      # The clearance bound is unchanged: 0.5 s at 0.22 m/s is ~0.11 m of
      # positional uncertainty against inflation_radius 0.25 - robot_radius
      # 0.11 = 0.14 m of clearance, ~0.03 m of headroom, scaling with max_vel_x.
      transform_tolerance: 0.5
      robot_radius: 0.11
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /robot_3/scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /robot_3/map          # SLAM's OccupancyGrid (absolute; avoids costmap sub-namespace)
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.25
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true          # plan into unmapped space so the explorer can push into frontiers

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    enable_stamped_cmd_vel: false
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: robot_3/odom
    global_frame: robot_3/map
    robot_base_frame: robot_3/base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

route_server:
  ros__parameters:
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: ["AdjustSpeedLimit", "ReroutingService", "CollisionMonitor"]
    ReroutingService:
      plugin: "nav2_route::ReroutingService"
    AdjustSpeedLimit:
      plugin: "nav2_route::AdjustSpeedLimit"
    CollisionMonitor:
      plugin: "nav2_route::CollisionMonitor"
      max_collision_dist: 3.0
    edge_cost_functions: ["DistanceScorer", "CostmapScorer"]
    DistanceScorer:
      plugin: "nav2_route::DistanceScorer"
    CostmapScorer:
      plugin: "nav2_route::CostmapScorer"

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    enable_stamped_cmd_vel: false
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.22, 0.0, 1.0]
    min_velocity: [-0.22, 0.0, -1.0]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "/robot_3/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    base_frame_id: robot_3/base_footprint
    odom_frame_id: robot_3/odom
    enable_stamped_cmd_vel: false
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: /robot_3/scan
      min_height: 0.15
      max_height: 2.0
      enabled: True

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: robot_3/base_footprint
    fixed_frame: robot_3/odom
    enable_stamped_cmd_vel: false
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    docks: ['home_dock']
    home_dock:
      type: 'simple_charging_dock'
      frame: robot_3/map
      pose: [0.0, 0.0, 0.0]
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
