name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: ros:jazzy
    defaults:
      run:
        # Container steps don't run login shells; every ROS step below
        # sources its environment explicitly.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Restores pip's download cache so the ~200MB CPU torch wheel is not
      # re-downloaded every run. In container jobs HOME=/github/home for all
      # steps, so pip and the cache action agree on ~/.cache/pip.
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install Python dependencies
        run: |
          # ros:jazzy ships without pip; its Ubuntu 24.04 Python is
          # externally managed (PEP 668), hence --break-system-packages.
          apt-get update
          apt-get install -y --no-install-recommends python3-pip
          pip3 install --break-system-packages torch --index-url https://download.pytorch.org/whl/cpu
          pip3 install --break-system-packages torch_geometric networkx

      - name: Build workspace
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build

      - name: Test
        env:
          # torch is installed above ON PURPOSE, so a torch that goes missing
          # here must FAIL the job. Without this the suite would skip its
          # torch-dependent tests and still report green (see test/conftest.py).
          NSK_REQUIRE_TORCH: '1'
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          source install/setup.bash

          # `shell: bash` is GitHub's default, i.e. `bash --noprofile --norc -eo
          # pipefail`. colcon test exits NONZERO on a collection failure (pytest
          # exits 2 and no test runs at all), so -e aborted the step right here —
          # before colcon test-result, the only command that reports WHY. Run
          # 30223348815 died exactly that way: "exited with code 2" and not one
          # line of diagnosis. Swallow the status; test-result stays the gate,
          # returning nonzero on any failure or error.
          colcon test --packages-select nsk_swarm nsk_swarm_interfaces || true

          # test-result prints a collection failure's MESSAGE ("collection
          # failure") and nothing else — the traceback exists only in the JUnit
          # XML. Dump it unconditionally, folded, so a green run stays readable
          # and a broken one always carries its cause in the console.
          for xml in build/*/pytest.xml; do
            [ -e "$xml" ] || continue
            echo "::group::$xml"
            cat "$xml"
            echo ""            # pytest.xml has no trailing newline; without this
                               # ::endgroup:: lands mid-line and never closes the fold
            echo "::endgroup::"
          done

          colcon test-result --verbose
