name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: ros:jazzy
    defaults:
      run:
        # Container steps don't run login shells; every ROS step below
        # sources its environment explicitly.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # Restores pip's download cache so the ~200MB CPU torch wheel is not
      # re-downloaded every run. In container jobs HOME=/github/home for all
      # steps, so pip and the cache action agree on ~/.cache/pip.
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install dependencies
        run: |
          # ros:jazzy ships without pip; its Ubuntu 24.04 Python is
          # externally managed (PEP 668), hence --break-system-packages.
          apt-get update
          apt-get install -y --no-install-recommends python3-pip
          pip3 install --break-system-packages torch --index-url https://download.pytorch.org/whl/cpu
          pip3 install --break-system-packages torch_geometric networkx

          # The ros:jazzy image is ros-core — no Nav2, no slam_toolbox. These
          # are import-time dependencies of the SUITE, not optional extras:
          #   navigation2  -> nav2_simple_commander, imported at module level by
          #                   frontier_explorer (FrontierExplorer subclasses
          #                   BasicNavigator, so the import cannot be deferred)
          #   nav2-bringup -> navigation_launch.py, which explore.launch.py
          #                   includes and test_launch_descriptions resolves via
          #                   get_package_share_directory. NOT pulled in by the
          #                   navigation2 metapackage — it must be named here.
          #   slam-toolbox -> not needed to BUILD explore.launch.py's
          #                   description (the node's package is resolved only at
          #                   execute time), but it keeps this image able to
          #                   actually run the launch file it tests.
          # Run 30224260962 died on exactly this: ModuleNotFoundError for
          # nav2_simple_commander, one import taking the whole collection down.
          apt-get install -y --no-install-recommends \
            ros-jazzy-navigation2 ros-jazzy-nav2-bringup ros-jazzy-slam-toolbox

      - name: Build workspace
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build

      - name: Test
        env:
          # Everything the step above installs is installed ON PURPOSE, so a
          # dependency that goes missing here must FAIL the job. Without these
          # the suite would skip the affected tests and still report green —
          # the readiness-gate and launch-description tests exist to catch what
          # static review misses, and a skipped one is decoration. Local shells
          # without the venv or without Nav2 still skip cleanly (see
          # test/conftest.py).
          NSK_REQUIRE_TORCH: '1'
          NSK_REQUIRE_NAV2: '1'
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          source install/setup.bash

          # `shell: bash` is GitHub's default, i.e. `bash --noprofile --norc -eo
          # pipefail`. colcon test exits NONZERO on a collection failure (pytest
          # exits 2 and no test runs at all), so -e aborted the step right here —
          # before colcon test-result, the only command that reports WHY. Run
          # 30223348815 died exactly that way: "exited with code 2" and not one
          # line of diagnosis. Swallow the status; test-result stays the gate,
          # returning nonzero on any failure or error.
          colcon test --packages-select nsk_swarm nsk_swarm_interfaces || true

          # test-result prints a collection failure's MESSAGE ("collection
          # failure") and nothing else — the traceback exists only in the JUnit
          # XML. Dump it unconditionally, folded, so a green run stays readable
          # and a broken one always carries its cause in the console.
          for xml in build/*/pytest.xml; do
            [ -e "$xml" ] || continue
            echo "::group::$xml"
            cat "$xml"
            echo ""            # pytest.xml has no trailing newline; without this
                               # ::endgroup:: lands mid-line and never closes the fold
            echo "::endgroup::"
          done

          colcon test-result --verbose
